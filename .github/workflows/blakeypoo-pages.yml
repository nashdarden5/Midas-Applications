name: Publish BlakeyPoo web app
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', 'tests-blakeypoo.cjs', '.github/workflows/blakeypoo-pages.yml']
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blakeypoo-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image optimization dependency
        run: python3 -m pip install --quiet Pillow beautifulsoup4
      - name: Refresh official GSA auction data
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: python3 scripts/fetch_gsa_vehicles.py
      - name: Refresh public GovDeals discovery
        run: python3 scripts/fetch_govdeals_vehicles.py
      - name: Refresh completed-auction comparison data
        run: python3 scripts/fetch_sold_comps.py
      - name: Verify dashboard logic and PWA assets
        run: |
          node --check docs/dashboard.js
          node --check docs/sw.js
          node tests-blakeypoo.cjs
          python3 scripts/test_gsa_vehicles.py
          python3 scripts/test_market_feeds.py
          test -f docs/icon-180.png && test -f docs/icon-512.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
