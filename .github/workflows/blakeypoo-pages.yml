name: Publish BlakeyPoo web app
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', 'tests-blakeypoo.cjs', '.github/workflows/blakeypoo-pages.yml']
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blakeypoo-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image optimization dependency
        run: python3 -m pip install --quiet Pillow beautifulsoup4
      - name: Refresh all auction feeds with per-source failure reporting
        env:
          GSA_API_KEY: ${{ secrets.GSA_API_KEY }}
        run: python3 scripts/refresh_market_feeds.py
      - name: Import contract-authorized provider feed when configured
        env:
          BLAKEYPOO_LICENSED_FEED_ENABLED: ${{ vars.BLAKEYPOO_LICENSED_FEED_ENABLED }}
          BLAKEYPOO_LICENSED_FEED_URL: ${{ vars.BLAKEYPOO_LICENSED_FEED_URL }}
          BLAKEYPOO_LICENSED_FEED_HOST: ${{ vars.BLAKEYPOO_LICENSED_FEED_HOST }}
          BLAKEYPOO_LICENSED_FEED_TOKEN: ${{ secrets.BLAKEYPOO_LICENSED_FEED_TOKEN }}
        run: python3 scripts/licensed_feed_pipeline.py
      - name: Verify dashboard logic and PWA assets
        run: |
          node --check docs/dashboard.js
          node --check docs/sw.js
          node tests-blakeypoo.cjs
          python3 scripts/test_gsa_vehicles.py
          python3 scripts/test_market_feeds.py
          python3 scripts/test_licensed_feed_pipeline.py
          python3 scripts/test_workspace.py
          python3 scripts/test_comparison.py
          python3 scripts/test_deal_winner.py
          python3 scripts/test_watchdog.py
          test -f docs/icon-180.png && test -f docs/icon-512.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
